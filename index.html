<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عالم الأكلية | Food World</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Cairo', sans-serif;
    background: #fff8ef;
    color: #222;
}

/* HEADER */

header {
    background: white;
    height: 75px;
    padding: 0 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 3px 15px #0001;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 24px;
    font-weight: 900;
    color: #d62828;
}

.language {
    padding: 9px 15px;
    border-radius: 10px;
    border: 1px solid #ddd;
    background: white;
    cursor: pointer;
    font-weight: bold;
    font-family: inherit;
}

/* PAGES */

.page {
    display: none;
    padding: 35px 6%;
    min-height: 85vh;
}

.page.active {
    display: block;
}

/* WELCOME PAGE */

.welcome {
    padding: 15px;
    text-align: center;
}

.welcome img {
    width: 100%;
    max-width: 1500px;
    height: auto;
    display: block;
    margin: auto;
    border-radius: 15px;
    cursor: pointer;
    box-shadow: 0 8px 30px #0002;
}

/* BUTTONS */

button {
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 12px 22px;
    font-family: inherit;
    font-weight: bold;
}

.primary {
    background: #d62828;
    color: white;
    transition: .3s;
}

.primary:hover {
    background: #a81717;
    transform: translateY(-3px);
}

/* MENU */

.section-title {
    text-align: center;
    font-size: 32px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
}

.products {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 25px;
    max-width: 1300px;
    margin: auto;
}

.card {
    background: white;
    border-radius: 17px;
    overflow: hidden;
    box-shadow: 0 5px 20px #0001;
    transition: .3s;
}

.card:hover {
    transform: translateY(-6px);
}

.card img {
    width: 100%;
    height: 210px;
    object-fit: cover;
}

.card-content {
    padding: 20px;
}

.card h3 {
    margin-bottom: 10px;
    font-size: 20px;
}

.card p {
    color: #777;
    min-height: 45px;
}

.price {
    color: #d62828;
    font-size: 24px;
    font-weight: 900;
    margin: 12px 0;
}

.old-price {
    text-decoration: line-through;
    color: #999;
    font-size: 15px;
    margin-inline-start: 8px;
}

.card button {
    width: 100%;
}

/* DETAILS */

.detail-box {
    max-width: 950px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
    box-shadow: 0 5px 20px #0001;
}

.detail-box img {
    width: 100%;
    height: 340px;
    object-fit: cover;
    border-radius: 15px;
}

.detail-info {
    align-self: center;
}

.detail-info h2 {
    margin-bottom: 15px;
    font-size: 28px;
}

.detail-info p {
    color: #777;
    line-height: 2;
}

.quantity {
    margin: 22px 0;
    display: flex;
    align-items: center;
    gap: 15px;
}

.quantity button {
    background: #eee;
    padding: 8px 16px;
    font-size: 20px;
}

.back {
    background: #eee;
    margin-bottom: 20px;
}

/* CART */

.cart-button {
    position: fixed;
    bottom: 22px;
    left: 22px;
    background: #222;
    color: white;
    border-radius: 40px;
    padding: 15px 22px;
    display: none;
    z-index: 200;
    box-shadow: 0 5px 20px #0003;
}

.cart-button.show {
    display: flex;
    align-items: center;
    gap: 10px;
}

.cart-count {
    background: #d62828;
    padding: 3px 9px;
    border-radius: 50%;
}

/* CHECKOUT */

.checkout {
    max-width: 1000px;
    margin: auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
}

.panel {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #0001;
}

.panel h3 {
    margin-bottom: 20px;
}

input, textarea, select {
    width: 100%;
    padding: 12px;
    margin: 7px 0 15px;
    border: 1px solid #ddd;
    border-radius: 9px;
    font-family: inherit;
    outline: none;
}

input:focus, textarea:focus {
    border-color: #d62828;
}

label {
    font-weight: bold;
    font-size: 14px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

.cart-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 14px 0;
    border-bottom: 1px solid #eee;
}

.remove {
    background: #ffe5e5;
    color: #c00;
    padding: 5px 10px;
}

.total {
    font-size: 22px;
    font-weight: bold;
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #888;
}

footer {
    text-align: center;
    padding: 25px;
    color: #777;
}

/* MOBILE */

@media(max-width:850px) {

    .products {
        grid-template-columns: repeat(2,1fr);
    }

    .checkout {
        grid-template-columns: 1fr;
    }

}

@media(max-width:550px) {

    .products {
        grid-template-columns: 1fr;
    }

    .detail-box {
        grid-template-columns: 1fr;
    }

    .page {
        padding: 25px 4%;
    }

    .section-title {
        font-size: 25px;
    }

    .logo {
        font-size: 19px;
    }

}

</style>
</head>

<body>

<!-- HEADER -->

<header>

    <div class="logo">
        🍕 <span data-t="logo">عالم الأكلية</span>
    </div>

    <select class="language" onchange="changeLanguage(this.value)">

        <option value="ar">🇪🇬 العربية</option>

        <option value="en">🇬🇧 English</option>

    </select>

</header>


<!-- WELCOME PAGE -->

<section id="welcome" class="page welcome active">

    <img
        src="welcome.png"
        alt="مرحبا بك في عالم الأكلية"
        onclick="showPage('menu')"
    >

</section>


<!-- MENU PAGE -->

<section id="menu" class="page">

    <h2 class="section-title" data-t="menuTitle">
        منيو البيتزا
    </h2>

    <p class="subtitle" data-t="menuSubtitle">
        اختار وجبتك المفضلة
    </p>

    <div class="products" id="products"></div>

</section>


<!-- PRODUCT DETAILS -->

<section id="details" class="page">

    <button class="back" onclick="showPage('menu')" data-t="back">
        العودة للمنيو
    </button>

    <div class="detail-box" id="detailContent"></div>

</section>


<!-- CART PAGE -->

<section id="checkout" class="page">

    <h2 class="section-title" data-t="cartTitle">
        سلة المشتريات
    </h2>

    <p class="subtitle" data-t="cartSubtitle">
        راجع طلبك قبل التأكيد
    </p>

    <div class="checkout">

        <div class="panel">

            <h3 data-t="yourOrder">🛒 طلبك</h3>

            <div id="cartItems"></div>

            <div class="total">

                <span data-t="total">الإجمالي</span>

                <span id="totalPrice">$0</span>

            </div>

        </div>


        <!-- CUSTOMER INFORMATION -->

        <form class="panel" id="orderForm">

            <h3 data-t="customerInfo">
                بيانات العميل
            </h3>

            <label data-t="name">الاسم بالكامل *</label>

            <input id="name" required>


            <label data-t="address">العنوان بالتفصيل *</label>

            <input id="address" required>


            <label data-t="phone">رقم الموبايل *</label>

            <input id="phone" type="tel" required>


            <label data-t="phone2">رقم آخر للتواصل</label>

            <input id="phone2" type="tel">


            <label data-t="notes">ملحوظات إضافية</label>

            <textarea id="notes"></textarea>


            <label data-t="payment">طريقة الدفع</label>

            <select id="payment">

                <option value="cash" data-t="cash">
                    كاش عند الاستلام
                </option>

            </select>


            <button
                class="primary"
                type="submit"
                style="width:100%"
                data-t="confirm">

                تأكيد الطلب عبر واتساب

            </button>

        </form>

    </div>

</section>


<!-- FLOATING CART -->

<button
    class="cart-button"
    id="cartButton"
    onclick="openCart()">

    🛒

    <span data-t="cart">السلة</span>

    <span class="cart-count" id="count">0</span>

</button>


<footer data-t="footer">

    عالم الأكلية - نتمنى لك وجبة شهية ❤️

</footer>


<script>

/* LANGUAGE SYSTEM */

const translations = {

ar: {

logo:"عالم الأكلية",

menuTitle:"منيو البيتزا",

menuSubtitle:"اختار وجبتك المفضلة",

back:"العودة للمنيو",

cartTitle:"سلة المشتريات",

cartSubtitle:"راجع طلبك قبل التأكيد",

yourOrder:"🛒 طلبك",

total:"الإجمالي",

customerInfo:"بيانات العميل",

name:"الاسم بالكامل *",

address:"العنوان بالتفصيل *",

phone:"رقم الموبايل *",

phone2:"رقم آخر للتواصل",

notes:"ملحوظات إضافية",

payment:"طريقة الدفع",

cash:"كاش عند الاستلام",

confirm:"تأكيد الطلب عبر واتساب",

cart:"السلة",

footer:"عالم الأكلية - نتمنى لك وجبة شهية ❤️",

details:"عرض التفاصيل واطلب",

add:"أضف إلى السلة",

quantity:"الكمية",

delete:"حذف",

empty:"السلة فارغة",

added:"تمت إضافة المنتج للسلة",

send:"طلب جديد من عالم الأكلية",

},

en: {

logo:"Food World",

menuTitle:"Pizza Menu",

menuSubtitle:"Choose Your Favorite Meal",

back:"Back to Menu",

cartTitle:"Shopping Cart",

cartSubtitle:"Review Your Order",

yourOrder:"🛒 Your Order",

total:"Total",

customerInfo:"Customer Information",

name:"Full Name *",

address:"Full Address *",

phone:"Mobile Number *",

phone2:"Alternative Phone",

notes:"Additional Notes",

payment:"Payment Method",

cash:"Cash on Delivery",

confirm:"Confirm Order via WhatsApp",

cart:"Cart",

footer:"Food World - Enjoy Your Meal ❤️",

details:"View Details & Order",

add:"Add to Cart",

quantity:"Quantity",

delete:"Remove",

empty:"Your Cart Is Empty",

added:"Product Added Successfully",

send:"New Order From Food World"

}

};


/* PRODUCTS */

const products = [

{

id:1,

name:{
ar:"عرض البيتزا المميز",
en:"Special Pizza Deal"
},

desc:{
ar:"بيتزا ميديام + بيتزا سمول هدية 🎁",
en:"One Medium Pizza + One FREE Small Pizza 🎁"
},

price:6,
old:9,

img:"photo1.png"

},

{

id:2,

name:{
ar:"عرض الاتنين ميديام",
en:"Two Medium Pizzas Deal"
},

desc:{
ar:"عدد 2 بيتزا ميديام",
en:"2 Medium Pizzas"
},

price:8,
old:11,

img:"photo2.png"

},

{

id:3,

name:{
ar:"عرض 2 لارج",
en:"Two Large Pizzas Deal"
},

desc:{
ar:"عدد 2 بيتزا لارج",
en:"2 Large Pizzas"
},

price:13,
old:16,

img:"photo3.png"

},

{

id:4,

name:{
ar:"بيتزا سمول",
en:"Small Pizza"
},

desc:{
ar:"بيتزا بالحجم الصغير",
en:"Small Size Pizza"
},

price:3,

img:"photo 4.png"

},

{

id:5,

name:{
ar:"بيتزا ميديام",
en:"Medium Pizza"
},

desc:{
ar:"بيتزا بالحجم المتوسط",
en:"Medium Size Pizza"
},

price:6,

img:"photo5.png"

},

{

id:6,

name:{
ar:"بيتزا لارج",
en:"Large Pizza"
},

desc:{
ar:"بيتزا بالحجم الكبير",
en:"Large Size Pizza"
},

price:9,

img:"photo6'.png"

}

];


let lang = "ar";

let cart = [];

let selected = null;

let qty = 1;


/* TRANSLATION */

function tr(key) {

    return translations[lang][key] || key;

}


function changeLanguage(value) {

    lang = value;

    document.documentElement.lang = lang;

    document.documentElement.dir =
        lang === "ar" ? "rtl" : "ltr";

    document.querySelectorAll("[data-t]").forEach(el => {

        el.textContent = tr(el.dataset.t);

    });

    renderProducts();

    if(selected) renderDetails();

    renderCart();

}


/* PAGE NAVIGATION */

function showPage(id) {

    document.querySelectorAll(".page").forEach(p => {

        p.classList.remove("active");

    });

    document.getElementById(id).classList.add("active");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* DISPLAY PRODUCTS */

function renderProducts() {

    document.getElementById("products").innerHTML =

    products.map(p => `

        <div class="card">

            <img src="${p.img}" alt="${p.name[lang]}" loading="lazy">

            <div class="card-content">

                <h3>${p.name[lang]}</h3>

                <p>${p.desc[lang]}</p>

                <div class="price">

                    $${p.price}

                    ${p.old ?
                    `<span class="old-price">$${p.old}</span>`
                    : ""}

                </div>

                <button
                    class="primary"
                    onclick="openDetails(${p.id})">

                    ${tr("details")}

                </button>

            </div>

        </div>

    `).join("");

}


/* PRODUCT DETAILS */

function openDetails(id) {

    selected = products.find(p => p.id === id);

    qty = 1;

    renderDetails();

    showPage("details");

}


function renderDetails() {

    document.getElementById("detailContent").innerHTML = `

        <img src="${selected.img}" alt="${selected.name[lang]}">

        <div class="detail-info">

            <h2>${selected.name[lang]}</h2>

            <p>${selected.desc[lang]}</p>

            <div class="price">

                $${selected.price}

                ${selected.old ?
                `<span class="old-price">$${selected.old}</span>`
                : ""}

            </div>

            <div class="quantity">

                ${tr("quantity")}

                <button onclick="changeQty(-1)">−</button>

                <strong id="qty">${qty}</strong>

                <button onclick="changeQty(1)">+</button>

            </div>

            <button
                class="primary"
                onclick="addToCart()">

                ${tr("add")} 🛒

            </button>

        </div>

    `;

}


function changeQty(number) {

    qty = Math.max(1, qty + number);

    document.getElementById("qty").textContent = qty;

}


/* ADD TO CART */

function addToCart() {

    let item = cart.find(p => p.id === selected.id);

    if(item) {

        item.qty += qty;

    } else {

        cart.push({
            ...selected,
            qty:qty
        });

    }

    updateCart();

    alert(tr("added"));

    showPage("menu");

}


/* CART COUNT */

function updateCart() {

    let count = cart.reduce((s,p) => s+p.qty, 0);

    document.getElementById("count").textContent = count;

    document.getElementById("cartButton")
    .classList.toggle("show", count > 0);

}


/* OPEN CART */

function openCart() {

    renderCart();

    showPage("checkout");

}


/* DISPLAY CART */

function renderCart() {

    const box = document.getElementById("cartItems");

    if(!cart.length) {

        box.innerHTML = `<div class="empty">${tr("empty")}</div>`;

        document.getElementById("totalPrice").textContent = "$0";

        return;

    }

    box.innerHTML = cart.map(p => `

        <div class="cart-line">

            <div>

                <b>${p.name[lang]}</b>

                <br>

                $${p.price} × ${p.qty}

            </div>

            <div>

                $${p.price*p.qty}

                <br>

                <button
                    class="remove"
                    onclick="removeItem(${p.id})">

                    ${tr("delete")}

                </button>

            </div>

        </div>

    `).join("");


    let total = cart.reduce((s,p) => s+p.price*p.qty, 0);

    document.getElementById("totalPrice").textContent = "$"+total;

}


/* REMOVE PRODUCT */

function removeItem(id) {

    cart = cart.filter(p => p.id !== id);

    updateCart();

    renderCart();

}


/* SEND ORDER TO WHATSAPP */

document.getElementById("orderForm").addEventListener("submit", function(e) {

    e.preventDefault();

    if(!cart.length) {

        alert(tr("empty"));

        return;

    }

    const name = document.getElementById("name").value.trim();

    const address = document.getElementById("address").value.trim();

    const phone = document.getElementById("phone").value.trim();

    const phone2 = document.getElementById("phone2").value.trim();

    const notes = document.getElementById("notes").value.trim();

    const payment = document.getElementById("payment").value;

    const items = cart.map(p =>

        `${p.name[lang]} x ${p.qty} = $${p.price*p.qty}`

    ).join("\n");


    const total = cart.reduce((s,p) => s+p.price*p.qty, 0);


    const message = `

${tr("send")}

${items}

${tr("total")}: $${total}

${tr("name")}: ${name}

${tr("address")}: ${address}

${tr("phone")}: ${phone}

${tr("phone2")}: ${phone2 || "غير متوفر"}

${tr("payment")}: ${payment}

${tr("notes")}: ${notes || "لا يوجد"}

`;


    const whatsapp =

    "https://wa.me/201025868767?text=" +

    encodeURIComponent(message);


    window.open(whatsapp, "_blank");

});


/* START */

renderProducts();

</script>

</body>
</html>
